name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-canonical:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Validate Backend (Express.js)
      - name: Install Backend Dependencies & Run Tests
        working-directory: ./backend
        run: |
          npm ci
          npm test

      # 2. Validate NLP Microservice (FastAPI + pytest)
      - name: Install NLP Dependencies & Run Pytest
        working-directory: ./nlp
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('stopwords'); nltk.download('wordnet'); nltk.download('omw-1.4')"
          pytest -v

      # 3. Validate Frontend (Next.js)
      - name: Install Frontend Dependencies & Run Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
