services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/pyqinsight
      NLP_URL: http://nlp:8000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [mongo, redis, nlp]
  nlp:
    build: ./nlp
    ports: ["8000:8000"]
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
  redis:
    image: redis:7-alpine
volumes:
  mongo-data:
